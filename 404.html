<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | AUM GROUP INC Fine Jewellery &amp; Gems</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23dfc7a7' stroke-width='1.5'><polygon points='6,3 18,3 22,9 12,22 2,9'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #090807;
      color: #fbf9f6;
      font-family: 'Inter', sans-serif;
      overflow: hidden;
    }

    .error-container {
      text-align: center;
      padding: 2rem;
      position: relative;
      z-index: 2;
    }

    /* Diamond SVG */
    .diamond-icon {
      width: 80px;
      height: 64px;
      color: #dfc7a7;
      margin: 0 auto 2rem;
      opacity: 0.6;
      animation: diamondFloat 3s ease-in-out infinite;
    }

    @keyframes diamondFloat {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(3deg); }
    }

    .error-code {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(6rem, 15vw, 12rem);
      font-weight: 300;
      letter-spacing: 0.05em;
      background: linear-gradient(135deg, #dfc7a7 0%, #c5a880 40%, #e8d5b8 60%, #b89c6e 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      margin-bottom: 0.5rem;
    }

    .error-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.4rem, 3vw, 2rem);
      font-weight: 400;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #dfc7a7;
      margin-bottom: 1.5rem;
    }

    .error-message {
      font-size: 0.95rem;
      color: #9a9490;
      line-height: 1.8;
      max-width: 420px;
      margin: 0 auto 2.5rem;
      font-weight: 300;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.9rem 2.5rem;
      background: transparent;
      border: 1px solid rgba(223, 199, 167, 0.3);
      color: #dfc7a7;
      font-family: 'Montserrat', 'Inter', sans-serif;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      position: relative;
      overflow: hidden;
    }

    .back-btn::before {
      content: '';
      position: absolute;
      top: 0; left: -100%; width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(223, 199, 167, 0.1), transparent);
      transition: left 0.5s ease;
    }

    .back-btn:hover {
      border-color: rgba(223, 199, 167, 0.6);
      background: rgba(223, 199, 167, 0.05);
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(223, 199, 167, 0.1);
    }

    .back-btn:hover::before { left: 100%; }

    .back-btn svg {
      width: 16px; height: 16px;
      transition: transform 0.3s ease;
    }

    .back-btn:hover svg { transform: translateX(-4px); }

    /* Ambient particles */
    .particle {
      position: fixed;
      width: 2px; height: 2px;
      background: rgba(223, 199, 167, 0.3);
      border-radius: 50%;
      animation: particleDrift linear infinite;
    }

    @keyframes particleDrift {
      0% { transform: translateY(100vh) scale(0); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 0.5; }
      100% { transform: translateY(-10vh) scale(1); opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="error-container">
    <svg class="diamond-icon" viewBox="0 0 40 32" fill="none" stroke="currentColor" stroke-width="1.3"
      stroke-linecap="round" stroke-linejoin="round">
      <polygon points="10,2 30,2 38,12 20,30 2,12" />
      <line x1="2" y1="12" x2="38" y2="12" />
      <line x1="10" y1="2" x2="15" y2="12" />
      <line x1="30" y1="2" x2="25" y2="12" />
      <line x1="15" y1="12" x2="20" y2="30" />
      <line x1="25" y1="12" x2="20" y2="30" />
      <line x1="20" y1="2" x2="15" y2="12" />
      <line x1="20" y1="2" x2="25" y2="12" />
    </svg>

    <div class="error-code">404</div>
    <h1 class="error-title">Gem Not Found</h1>
    <p class="error-message">
      The treasure you seek has moved to a different vault.
      Let us guide you back to our collection.
    </p>

    <a href="/" class="back-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      Return to Collection
    </a>
  </div>

  <!-- Ambient particles -->
  <script>
    for (let i = 0; i < 30; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.left = Math.random() * 100 + '%';
      p.style.animationDuration = (Math.random() * 8 + 5) + 's';
      p.style.animationDelay = (Math.random() * 5) + 's';
      p.style.width = p.style.height = (Math.random() * 3 + 1) + 'px';
      document.body.appendChild(p);
    }
  </script>
</body>
</html>
