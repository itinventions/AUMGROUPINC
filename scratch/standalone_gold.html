<!DOCTYPE html>
<html lang="en">
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AUM GROUP INC | Fine Jewellery &amp; Gems</title>
  <meta name="description"
    content="Discover a world of rare and exquisite gemstones, crafted into timeless jewellery that tells your story.">

  <!-- Canonical URL -->
  <link rel="canonical" href="https://aumgroupinc.com/">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23dfc7a7' stroke-width='1.5'><polygon points='6,3 18,3 22,9 12,22 2,9'/></svg>">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://aumgroupinc.com/">
  <meta property="og:title" content="AUM GROUP INC | Fine Jewellery &amp; Gems">
  <meta property="og:description" content="Discover a world of rare and exquisite gemstones, crafted into timeless jewellery that tells your story.">
  <meta property="og:site_name" content="AUM GROUP INC Fine Jewellery &amp; Gems">
  <meta property="og:locale" content="en_US">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="AUM GROUP INC | Fine Jewellery &amp; Gems">
  <meta name="twitter:description" content="Discover a world of rare and exquisite gemstones, crafted into timeless jewellery that tells your story.">

  <!-- Additional SEO -->
  <meta name="author" content="Aum Group Inc.">
  <meta name="keywords" content="fine jewellery, gems, diamonds, luxury jewellery, Aum Group Inc, aumgroupinc, gemstones, engagement rings, gold jewellery">
  <meta name="theme-color" content="#090807">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'gold-champagne': '#dfc7a7',
            'gold-btn': '#e2c9a8',
            'gold-hover': '#ebd5ba',
            'gold-accent': '#c5a880',
            'dark-bg': '#090807',
            'text-white': '#fbf9f6',
            'text-muted': '#cfc7be',
          },
          fontFamily: {
            serif: ['"Cormorant Garamond"', 'Didot', 'serif'],
            sans: ['"Montserrat"', '"Inter"', 'sans-serif'],
            body: ['"Inter"', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Google Fonts: Cormorant Garamond, Montserrat, Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Montserrat:wght@200;300;400;500;600;700&family=Inter:wght@300;400;500&display=swap"
    rel="stylesheet">

  <!-- External Stylesheets (Modular Folder Structure) -->
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="animations.css">

  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
  body { margin: 0; padding: 0; background: #000; }
  .reveal-on-scroll { opacity: 1 !important; transform: none !important; }
</style>
</head>
<body>
<section class="gold-showcase-section" id="gold-collection" aria-label="Gold Collection Showcase">

      <!-- Dynamic Full-Bleed Background Layer -->
      <div class="gold-showcase-bg" aria-hidden="true">
        <div class="gold-showcase-backdrop"></div>
      </div>

      <!-- Main Section Container: Left-Aligned Stack -->
      <div class="gold-banner-container">

        <div class="gold-banner-stack">

          <!-- Upper Side: Header & Subtitle Text -->
          <div class="gold-banner-header reveal-on-scroll">
            <h2 class="gold-banner-title font-serif-italic">Gold Collection</h2>
            <p class="gold-banner-desc">
              A timeless expression of purity and value. Our gold feature elegant desi designs crafted with certified, hallmarked gold.
            </p>
          </div>

          <!-- Middle: 3 Product Images / Cards (Left-Aligned Row) -->
          <div class="gold-banner-cards-row reveal-on-scroll delay-1">

            <!-- Card 1: Gold Necklace -->
            <article class="gold-thumb-card group" tabindex="0">
              <div class="gold-thumb-img-wrap">
                <img
                  src="../assets/images/products/Gold%20Section%20Image1.png"
                  alt="Gold Necklace"
                  class="gold-thumb-img"
                  loading="lazy"
                  decoding="async"
                >
              </div>
              <span class="gold-thumb-label">Gold Necklace</span>
            </article>

            <!-- Card 2: Gold Ring -->
            <article class="gold-thumb-card group" tabindex="0">
              <div class="gold-thumb-img-wrap">
                <img
                  src="../assets/images/products/Gold%20Section%20Image2.png"
                  alt="Gold Ring"
                  class="gold-thumb-img"
                  loading="lazy"
                  decoding="async"
                >
              </div>
              <span class="gold-thumb-label">Gold Ring</span>
            </article>

            <!-- Card 3: Gold Bangle -->
            <article class="gold-thumb-card group" tabindex="0">
              <div class="gold-thumb-img-wrap">
                <img
                  src="../assets/images/products/Gold%20Section%20Image3.png"
                  alt="Gold Bangle"
                  class="gold-thumb-img"
                  loading="lazy"
                  decoding="async"
                >
              </div>
              <span class="gold-thumb-label">Gold Bangle</span>
            </article>

          </div>

          <!-- Bottom: Explore Now Button Under the Product Cards -->
          <div class="gold-banner-btn-wrap reveal-on-scroll delay-2">
            <a href="#contact" class="gold-emerald-btn group" aria-label="Explore Gold Collection">
              <span>Explore Now</span>
              <svg class="gold-emerald-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
              </svg>
            </a>
          </div>

        </div>

      </div>

    </section>
</body>
</html>
